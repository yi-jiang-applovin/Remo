[workspace]
resolver = "2"
members = [
    ".",
    "crates/remo-protocol",
    "crates/remo-transport",
    "crates/remo-usbmuxd",
    "crates/remo-sdk",
    "crates/remo-objc",
    "crates/remo-cli",
    "crates/remo-bonjour",
    "crates/remo-cdp",
    "crates/remo-mcp",
]

[workspace.lints.clippy]
# Correctness & safety
await_holding_lock = "warn"
large_futures = "warn"
undocumented_unsafe_blocks = "warn"

# Style & idioms
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"

# Performance
trivially_copy_pass_by_ref = "warn"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.package]
version = "0.4.4"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/yjmeqt/Remo"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Bytes / framing
bytes = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# plist (for usbmuxd)
plist = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Async utilities
futures = "0.3"
dashmap = "6"

# Encoding
base64 = "0.22"

# Web server
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# A raw WebSocket client: used as a dev-dependency at the workspace root to
# prove the real dual-stack `RemoServer` against actual CDP framing
# (independent of remo-cdp's own server-side codec), and as a real
# (non-dev) dependency of `remo-mcp`, which dials `Remo`-speaking CDP
# servers as an actual client.
tokio-tungstenite = "0.28"

# Async trait objects (dyn-safe async fns in traits)
async-trait = "0.1"

# CDP: typed structs generated from Chrome's own protocol.json/PDL, for the
# standard domains (Page/DOM/CSS/Overlay) remo-cdp reuses.
chromiumoxide_cdp = "0.9"
chromiumoxide_types = "0.9"

# MCP: the official Rust SDK, used by `remo-mcp` (the agent-facing companion
# server) to expose `Remo.*` CDP calls as MCP tools. `schemars` derives the
# tools' JSON input schemas.
rmcp = "3"
schemars = "1"

# SQLite: generic `sqlite.query` capability (remo-sdk), any .sqlite/.db file
# in the app's own sandbox, not tied to any specific ORM (GRDB, Core Data's
# own store, a hand-rolled schema). "bundled" compiles SQLite from source
# instead of linking whatever system libsqlite3 a target provides — slower
# to build, but the one choice that's reliably available when cross-compiling
# for iOS, not just this dev machine.
rusqlite = { version = "0.32", features = ["bundled"] }

[package]
name = "remo-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dev-dependencies]
remo-protocol = { path = "crates/remo-protocol" }
remo-transport = { path = "crates/remo-transport" }
remo-sdk = { path = "crates/remo-sdk" }
tokio = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies.tokio-tungstenite]
workspace = true

[dev-dependencies.futures]
workspace = true

[package]
name = "remo-sdk"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[lib]
# When building for iOS, use: cargo build --features ios
crate-type = ["lib", "staticlib"]

[dependencies]
remo-protocol = { path = "../remo-protocol" }
remo-transport = { path = "../remo-transport" }
remo-objc = { path = "../remo-objc" }
remo-bonjour = { path = "../remo-bonjour" }
# One-directional per the rewrite plan: remo-sdk depends on remo-cdp, never
# the other way around — remo-cdp stays standalone (see its own Cargo.toml).
remo-cdp = { path = "../remo-cdp" }

[dependencies.async-trait]
workspace = true

[dependencies.axum]
workspace = true

[features]
default = []
ios = ["remo-objc/uikit", "remo-cdp/ios"]

[dependencies.tokio]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dependencies.dashmap]
workspace = true

[dependencies.futures]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.rusqlite]
workspace = true

[dependencies.base64]
workspace = true

[build-dependencies]
# cbindgen = "0.27"  # Uncomment when generating C headers

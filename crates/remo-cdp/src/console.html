<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remo console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #161a20;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #5b9dff;
    --ok: #4caf7d;
    --err: #e5636b;
    font-family: -apple-system, "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
    font-size: 14px;
    line-height: 1.5;
  }
  h1 {
    font-size: 1rem;
    margin: 0 0 0.25rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.85rem; }
  .status-dot {
    width: 0.6em; height: 0.6em; border-radius: 50%;
    background: var(--muted); display: inline-block;
  }
  .status-dot.ok { background: var(--ok); }
  .status-dot.err { background: var(--err); }
  main { display: grid; gap: 1rem; max-width: 720px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  label { display: block; color: var(--muted); margin-bottom: 0.3rem; font-size: 0.8rem; }
  input, textarea {
    width: 100%;
    background: #0b0d11;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem;
    font: inherit;
  }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row { display: flex; gap: 0.75rem; margin-bottom: 0.75rem; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: #0b0d11;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: 0.5; cursor: default; }
  pre {
    background: #0b0d11;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    overflow-x: auto;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  pre.err { border-color: var(--err); color: var(--err); }
  ul#caps { margin: 0.5rem 0 0; padding-left: 1.2rem; }
  ul#caps li { cursor: pointer; color: var(--accent); }
  ul#caps li:hover { text-decoration: underline; }
  code { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div>
    <h1><span id="dot" class="status-dot"></span> Remo console</h1>
    <p class="sub">Zero-install access to <code>Remo.invoke</code> — no <code>remo-cli</code> needed.
      Also usable programmatically as <code>window.remo</code> (see the browser console for a usage hint).</p>
  </div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="cap">Capability</label>
        <input id="cap" placeholder="__ping" autocomplete="off">
      </div>
    </div>
    <label for="args">Args (JSON)</label>
    <textarea id="args">{}</textarea>
    <div class="row" style="margin-top: 0.75rem;">
      <button id="invoke">Invoke</button>
      <button id="list" class="secondary">List capabilities</button>
    </div>
    <ul id="caps"></ul>
  </div>

  <div class="panel">
    <label>Result</label>
    <pre id="out">(nothing yet)</pre>
  </div>
</main>

<script>
(function () {
  "use strict";

  const wsUrl = "ws://" + location.host + "/devtools/page/1";
  const dot = document.getElementById("dot");
  const out = document.getElementById("out");
  const capsList = document.getElementById("caps");

  let socket = null;
  let nextId = 1;
  const pending = new Map();
  let connectPromise = null;

  function setStatus(state) {
    dot.className = "status-dot" + (state ? " " + state : "");
  }

  function connect() {
    if (connectPromise) return connectPromise;
    connectPromise = new Promise((resolve, reject) => {
      const ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        socket = ws;
        setStatus("ok");
        resolve(ws);
      };
      ws.onerror = () => {
        setStatus("err");
      };
      ws.onclose = () => {
        setStatus("err");
        socket = null;
        connectPromise = null;
        for (const { reject } of pending.values()) {
          reject(new Error("connection closed"));
        }
        pending.clear();
        reject(new Error("connection closed before it opened"));
      };
      ws.onmessage = (event) => {
        let envelope;
        try {
          envelope = JSON.parse(event.data);
        } catch {
          return; // not a JSON frame we understand
        }
        if (typeof envelope.id !== "number") return; // an event, not a reply
        const waiter = pending.get(envelope.id);
        if (!waiter) return;
        pending.delete(envelope.id);
        if (envelope.error) {
          waiter.reject(new Error(envelope.error.message || JSON.stringify(envelope.error)));
        } else {
          waiter.resolve(envelope.result);
        }
      };
    });
    return connectPromise;
  }

  /**
   * Sends one raw CDP request ({id, method, params}) and resolves with its
   * `result`, or rejects with the CDP error's message. This is the escape
   * hatch to any domain method (`Page.captureScreenshot`, `DOM.getDocument`,
   * ...), not just the `Remo.*` domain.
   */
  async function call(method, params) {
    const ws = socket || (await connect());
    const id = nextId++;
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      ws.send(JSON.stringify({ id, method, params: params || {} }));
    });
  }

  /** Invokes a named, developer-registered capability (`Remo.invoke`). */
  async function invoke(name, args) {
    const result = await call("Remo.invoke", { name, args: args || {} });
    return result.result;
  }

  /** Lists every capability name currently invokable (`Remo.listCapabilities`). */
  async function listCapabilities() {
    const result = await call("Remo.listCapabilities", {});
    return result.names;
  }

  window.remo = { url: wsUrl, connect, call, invoke, listCapabilities };

  console.info(
    "Remo console ready. Try in this console:\n" +
    '  await remo.listCapabilities()\n' +
    '  await remo.invoke("__ping", {})\n' +
    '  await remo.call("Page.captureScreenshot", {format: "jpeg"})'
  );

  connect().catch(() => {}); // status dot reflects failure; UI actions still retry via call()

  function render(value) {
    out.className = "";
    out.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }

  function renderError(error) {
    out.className = "err";
    out.textContent = String(error && error.message ? error.message : error);
  }

  document.getElementById("invoke").addEventListener("click", async () => {
    const name = document.getElementById("cap").value.trim();
    if (!name) {
      renderError(new Error("enter a capability name first"));
      return;
    }
    let args;
    try {
      args = JSON.parse(document.getElementById("args").value || "{}");
    } catch (e) {
      renderError(new Error("args is not valid JSON: " + e.message));
      return;
    }
    try {
      render(await invoke(name, args));
    } catch (e) {
      renderError(e);
    }
  });

  document.getElementById("list").addEventListener("click", async () => {
    try {
      const names = await listCapabilities();
      render(names);
      capsList.innerHTML = "";
      for (const name of names) {
        const li = document.createElement("li");
        li.textContent = name;
        li.addEventListener("click", () => {
          document.getElementById("cap").value = name;
        });
        capsList.appendChild(li);
      }
    } catch (e) {
      renderError(e);
    }
  });
})();
</script>
</body>
</html>

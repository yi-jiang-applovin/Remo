[package]
name = "remo-cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "remo"
path = "src/main.rs"

[dependencies]
# Only used for the `DEFAULT_PORT` constant shared with the on-device
# listener — this crate does not speak remo-protocol's length-prefixed wire
# format anymore, that's all handled by remo-cdp/remo-sdk on the device side.
remo-protocol = { path = "../remo-protocol" }
remo-usbmuxd = { path = "../remo-usbmuxd" }
remo-bonjour = { path = "../remo-bonjour" }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64.workspace = true

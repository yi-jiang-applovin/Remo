[package]
name = "remo-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Agent-facing MCP companion server: a thin proxy from three MCP tools onto the Remo CDP domain (Remo.invoke / Remo.listCapabilities) over a raw WebSocket."

[[bin]]
name = "remo-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "schemars"] }
schemars = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# .xc-dev/tasks.toml
[tasks.rust-sdk]
desc = "Build the Rust CDP core (remo-sdk) into swift/RemoSDK.xcframework for simulator"
cmd  = """
set -euo pipefail
cd {{git_root}}
./build-ios.sh sim
"""

[tasks.build]
depends = ["rust-sdk"]
args = ["config=Debug"]
desc = "Rebuild the xcframework, then build RemoExample for the worktree simulator"
cmd  = """
set -euo pipefail
xcodebuild -scheme {{scheme}} \
  -configuration {{config}} \
  -derivedDataPath {{derived_data}} \
  -destination "platform=iOS Simulator,id={{sim_id}}" \
  build
"""

[tasks.sim-bootstrap]
desc = "Ensure the worktree-tagged simulator exists (lazy create on first reference)"
cmd  = """
echo "name:    {{sim_name}}"
echo "udid:    {{sim_id}}"
echo "runtime: {{sim_runtime}}"
"""

[tasks.sim-delete]
desc = "Delete the worktree-tagged simulator and clear the cache"
cmd  = """
NAME="{{sim_name}}"
xcrun simctl delete "$NAME" 2>/dev/null && echo "Deleted $NAME" || echo "Not present: $NAME"
rm -f {{xc_dev_dir}}/simulator.local.toml
"""

[tasks.clean]
depends = ["sim-delete"]
desc = "Wipe local + system DerivedData for this project, then delete the worktree sim"
cmd  = "xc-dev :clean --yes"

[tasks.run]
depends = ["build"]
args = ["swiftui_debug=0"]
desc = "Boot the worktree sim, install, launch (swiftui_debug=1 enables the experimental SwiftUI Elements-panel capture)"
cmd  = """
set -euo pipefail
xcrun simctl boot {{sim_id}} 2>/dev/null || true
xcrun simctl install {{sim_id}} {{app_path}}
xcrun simctl terminate {{sim_id}} {{bundle_id}} 2>/dev/null || true
if [ "{{swiftui_debug}}" = "1" ]; then
  SIMCTL_CHILD_SWIFTUI_VIEW_DEBUG=1 xcrun simctl launch {{sim_id}} {{bundle_id}}
else
  xcrun simctl launch {{sim_id}} {{bundle_id}}
fi
"""

[tasks.devtools]
desc = "Print the devtools:// URL for the worktree sim's running Remo instance (pass port=<n>)"
args = ["port"]
cmd  = """
open -a "Google Chrome" "devtools://devtools/bundled/inspector.html?ws=127.0.0.1:{{port}}/devtools/page/1"
"""

[tasks.test-package]
desc = "Run RemoExampleFeatureTests (swift test)"
cmd  = "swift test --package-path RemoExamplePackage"
